AWSTemplateFormatVersion: '2010-09-09'
Description: >
  BOOKFLOW - Ping Test VPC (10.100.0.0/24)
  Minimal infra for Azure/GCP connectivity verification:
  VPC + PublicSubnet + IGW + TGW Attachment + t3.micro EC2 (SSH)

Parameters:
  ProjectName:
    Type: String
    Default: bookflow
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 SSH key pair name
  AzureVnetCidr:
    Type: String
    Default: 172.16.0.0/16
  GcpVpcCidr:
    Type: String
    Default: 192.168.10.0/24
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.100.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-vpc-ping-test' }]

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.100.0.0/26
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-ping-test-public' }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-ping-test-igw' }]

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  Rt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-ping-test-rt' }]

  RtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref Rt

  RouteIgw:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref Rt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  # Routes to Azure/GCP must be added after TgwAttach is created
  RouteToAzure:
    Type: AWS::EC2::Route
    DependsOn: TgwAttach
    Properties:
      RouteTableId: !Ref Rt
      DestinationCidrBlock: !Ref AzureVnetCidr
      TransitGatewayId: !ImportValue { Fn::Sub: '${ProjectName}-tgw-id' }

  RouteToGcp:
    Type: AWS::EC2::Route
    DependsOn: TgwAttach
    Properties:
      RouteTableId: !Ref Rt
      DestinationCidrBlock: !Ref GcpVpcCidr
      TransitGatewayId: !ImportValue { Fn::Sub: '${ProjectName}-tgw-id' }

  TgwAttach:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId: !ImportValue { Fn::Sub: '${ProjectName}-tgw-id' }
      VpcId: !Ref Vpc
      SubnetIds: [!Ref PublicSubnet]
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-tgw-attach-ping-test' }]

  TgwRtAssoc:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !Ref TgwAttach
      TransitGatewayRouteTableId: !ImportValue { Fn::Sub: '${ProjectName}-tgw-rt-id' }

  TgwRtProp:
    Type: AWS::EC2::TransitGatewayRouteTablePropagation
    Properties:
      TransitGatewayAttachmentId: !Ref TgwAttach
      TransitGatewayRouteTableId: !ImportValue { Fn::Sub: '${ProjectName}-tgw-rt-id' }

  # Inbound: ICMP (ping) + SSH (22)
  # Outbound: all (ICMP packets to Azure/GCP via TGW)
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ping test EC2 - ICMP + SSH inbound / all outbound
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-ping-test-sg' }]

  PingTestEc2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref Sg]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum install -y iputils
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-ping-test-ec2' }]

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub '${ProjectName}-vpc-ping-test-id' }
  Ec2InstanceId:
    Value: !Ref PingTestEc2
    Export: { Name: !Sub '${ProjectName}-ping-test-ec2-id' }
  Ec2PublicIp:
    Value: !GetAtt PingTestEc2.PublicIp
    Export: { Name: !Sub '${ProjectName}-ping-test-ec2-public-ip' }
  Ec2PrivateIp:
    Value: !GetAtt PingTestEc2.PrivateIp
